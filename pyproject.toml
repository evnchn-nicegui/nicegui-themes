[project]
name = "nicegui-themes"
version = "0.0.2"
description = "Curated shape-pass themes for NiceGUI"
authors = [{name = "Evan Chan", email = "evan@nicegui.io"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "nicegui>=3.10",
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/evnchn-nicegui/nicegui-themes"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nicegui_themes"]
